<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" fill="none">
  <title>SessionTree — an illustrative conversation tree</title>
  <desc>Fictional conversations branch from left to right. One branch is archived and the current conversation is highlighted. No real conversation data is shown.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#3b4159"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#b5a4ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="muted-arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#767b90" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family:"Segoe UI",Arial,sans-serif; }
      .card { fill:#2d303e; stroke:#53516d; }
      .heading { fill:#eff0f8; font-size:15px; font-weight:600; }
      .excerpt { fill:#a9b0cb; font-size:12px; }
      .label { fill:#bac5e9; }
      .toggle { fill:#282b38; stroke:#66617d; }
    </style>
  </defs>
  <rect width="1280" height="500" rx="14" fill="#252733"/>
  <rect x=".5" y=".5" width="1279" height="499" rx="13.5" stroke="#414557"/>
  <rect x="1" y="1" width="1278" height="498" rx="13" fill="url(#grid)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 232C263 232 261 119 274 119" stroke="#767b90" stroke-width="1.4" marker-end="url(#muted-arrow)"/>
    <path d="M250 232C263 232 261 345 274 345" stroke="#b5a4ef" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M492 345C505 345 503 267 516 267" stroke="#b5a4ef" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M492 345C505 345 503 423 516 423" stroke="#767b90" stroke-width="1.4" marker-end="url(#muted-arrow)"/>
    <path d="M734 267H758" stroke="#b5a4ef" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M976 267H1000" stroke="#767b90" stroke-width="1.4" marker-end="url(#muted-arrow)"/>
  </g>
  <g transform="translate(40 179)">
    <rect class="card" width="202" height="106" rx="9"/>
    <text class="heading" x="14" y="28">Project plan</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Explore a small website.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Let's outline a first draft.</text>
  </g>
  <g transform="translate(282 66)" opacity=".57">
    <rect class="card" width="202" height="106" rx="9" stroke-dasharray="4 3"/>
    <rect x="137" y="12" width="53" height="19" rx="5" stroke="#686c7e"/>
    <text x="164" y="25" fill="#bdc1cf" font-size="10" text-anchor="middle">Archived</text>
    <text class="heading" x="14" y="29">Early idea</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Try a different layout.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Save this as an option.</text>
  </g>
  <g transform="translate(282 292)">
    <rect class="card" width="202" height="106" rx="9"/>
    <text class="heading" x="14" y="28">Working prototype</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Build the first version.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Basic layout is ready.</text>
  </g>
  <g transform="translate(524 214)">
    <rect class="card" width="202" height="106" rx="9"/>
    <text class="heading" x="14" y="28">Polish the UI</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Improve spacing and type.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Use a clearer hierarchy.</text>
  </g>
  <g transform="translate(524 370)">
    <rect class="card" width="202" height="106" rx="9"/>
    <text class="heading" x="14" y="28">Another approach</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Compare a second option.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Keep a separate branch.</text>
  </g>
  <g transform="translate(766 214)">
    <rect x="-4" y="-4" width="210" height="114" rx="13" stroke="#a28acb" opacity=".32"/>
    <rect width="202" height="106" rx="9" fill="#39344c" stroke="#b5a4ef" stroke-width="1.5"/>
    <rect x="143" y="12" width="47" height="19" rx="5" fill="#514969"/>
    <text x="166.5" y="25" fill="#d2c4ff" font-size="10" font-weight="600" text-anchor="middle">Current</text>
    <text class="heading" x="14" y="29">Release plan</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Review the finished work.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Ready for the next step.</text>
  </g>
  <g transform="translate(1008 214)">
    <rect class="card" width="202" height="106" rx="9"/>
    <text class="heading" x="14" y="28">Next iteration</text>
    <text class="excerpt" x="14" y="55"><tspan class="label">User:</tspan> Explore a new direction.</text>
    <text class="excerpt" x="14" y="77"><tspan class="label">Codex:</tspan> Start from this version.</text>
  </g>
  <g stroke-linecap="round">
    <circle class="toggle" cx="242" cy="232" r="7"/><path d="M239 232h6" stroke="#b5a4ef"/>
    <circle class="toggle" cx="484" cy="345" r="7"/><path d="M481 345h6" stroke="#b5a4ef"/>
    <circle class="toggle" cx="726" cy="267" r="7"/><path d="M723 267h6" stroke="#b5a4ef"/>
    <circle class="toggle" cx="968" cy="267" r="7"/><path d="M965 267h6" stroke="#9ca0b5"/>
  </g>
  <text x="1210" y="470" fill="#858ba1" font-size="11" text-anchor="end">Illustration · fictional conversations</text>
</svg>
